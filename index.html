<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RivalStrike 3D Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu" class="screen">
    <div class="panel">
      <div class="logo">RIVAL<span>STRIKE</span></div>
      <p class="tag">3D ARENA TAG</p>
      <button id="playBtn">PLAY</button>
      <div class="tips">
        <b>CONTROLS</b>
        <span>W A S D — Move</span>
        <span>Mouse — Look</span>
        <span>SHIFT — Sprint</span>
        <span>ESC — Pause</span>
        <span>SPACE — Jump</span>
      </div>
    </div>
  </div>

  <div id="game" hidden>
    <canvas id="scene"></canvas>
    <div id="crosshair">+</div>
    <div id="hud">
      <div class="box">ENERGY <b id="energy">100</b></div>
      <div class="box">TAGS <b id="tags">0</b></div>
      <div class="box">TIME <b id="time">120</b></div>
    </div>
    <div id="hint">CLICK THE GAME TO LOCK YOUR MOUSE</div>
    <div id="pause" hidden>
      <div class="panel small">
        <h2>PAUSED</h2>
        <button id="resumeBtn">RESUME</button>
        <button id="homeBtn">MAIN MENU</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
