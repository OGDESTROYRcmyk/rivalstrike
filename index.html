<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RivalStrike</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    font-weight:bold;
}

#weaponName{
    position:absolute;
    right:25px;
    bottom:80px;
    font-size:25px;
    font-weight:bold;
}

#ammo{
    position:absolute;
    right:25px;
    bottom:45px;
    font-size:20px;
}

#info{
    position:absolute;
    left:20px;
    top:20px;
    background:rgba(0,0,0,.65);
    padding:12px;
    border-radius:10px;
    line-height:1.5;
}

#message{
    position:absolute;
    left:50%;
    top:20px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    padding:10px 20px;
    border-radius:10px;
}

#gun{
    position:absolute;
    right:10%;
    bottom:0;
    width:380px;
    height:300px;
}

/* 3D-style AR */
.ar{
    position:absolute;
    right:20px;
    bottom:80px;
    width:320px;
    height:100px;
    transform:rotate(-5deg);
}

.arBody{
    position:absolute;
    right:50px;
    top:20px;
    width:210px;
    height:60px;
    background:linear-gradient(145deg,#555,#151515);
    border-radius:8px;
    box-shadow:inset 0 5px 10px #777;
}

.arBarrel{
    position:absolute;
    right:-40px;
    top:38px;
    width:100px;
    height:20px;
    background:#090909;
}

.arMagazine{
    position:absolute;
    right:150px;
    top:65px;
    width:35px;
    height:75px;
    background:#222;
    transform:rotate(12deg);
    border-radius:5px;
}

.arGrip{
    position:absolute;
    right:85px;
    top:65px;
    width:30px;
    height:70px;
    background:#171717;
    transform:rotate(15deg);
}

/* Handgun */
.handgun{
    position:absolute;
    right:40px;
    bottom:70px;
    width:270px;
    height:220px;
}

.slide{
    position:absolute;
    right:20px;
    top:40px;
    width:200px;
    height:50px;
    background:linear-gradient(145deg,#666,#171717);
    border-radius:6px;
}

.handBarrel{
    position:absolute;
    right:-20px;
    top:55px;
    width:55px;
    height:18px;
    background:#080808;
}

.handGrip{
    position:absolute;
    right:80px;
    top:85px;
    width:48px;
    height:110px;
    background:#181818;
    transform:rotate(12deg);
    border-radius:5px;
}

/* Fists */
.fists{
    position:absolute;
    right:50px;
    bottom:20px;
    width:300px;
    height:220px;
}

.fist{
    position:absolute;
    width:110px;
    height:105px;
    background:linear-gradient(145deg,#d28a5c,#754329);
    border:4px solid #4d2a1a;
    border-radius:45%;
}

.fist1{
    left:20px;
    bottom:20px;
    transform:rotate(-20deg);
}

.fist2{
    right:10px;
    bottom:10px;
    transform:rotate(20deg);
}

/* Grenade */
.grenade{
    position:absolute;
    right:120px;
    bottom:60px;
    width:80px;
    height:120px;
}

.grenadeBody{
    position:absolute;
    bottom:0;
    left:5px;
    width:70px;
    height:85px;
    border-radius:45%;
    background:radial-gradient(circle at 30% 25%,#687566,#182018);
}

.grenadeTop{
    position:absolute;
    left:27px;
    top:10px;
    width:30px;
    height:30px;
    background:#222;
}

.hidden{
    display:none;
}

#hitmarker{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:45px;
    opacity:0;
}

.hit{
    animation:hit .15s;
}

@keyframes hit{
    0%{opacity:1}
    100%{opacity:0}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

<div id="info">
<b>RIVALSTRIKE</b><br>
W A S D = Move<br>
Mouse = Aim<br>
Left Click = Shoot<br>
R = Reload<br>
1 = AR<br>
2 = Handgun<br>
3 = Fists<br>
4 = Grenade
</div>

<div id="message">Ready!</div>

<div id="crosshair">+</div>

<div id="hitmarker">✕</div>

<div id="weaponName">AR</div>
<div id="ammo">30 / 30</div>

<div id="gun">

<div id="ar" class="ar">
    <div class="arBody"></div>
    <div class="arBarrel"></div>
    <div class="arMagazine"></div>
    <div class="arGrip"></div>
</div>

<div id="handgun" class="handgun hidden">
    <div class="slide"></div>
    <div class="handBarrel"></div>
    <div class="handGrip"></div>
</div>

<div id="fists" class="fists hidden">
    <div class="fist fist1"></div>
    <div class="fist fist2"></div>
</div>

<div id="grenade" class="grenade hidden">
    <div class="grenadeBody"></div>
    <div class="grenadeTop"></div>
</div>

</div>
</div>

<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}

resize();
addEventListener("resize",resize);


/* =========================
   PLAYER
========================= */

const player={
    x:0,
    y:0,
    angle:0,
    speed:4
};

const pressed={};

addEventListener("keydown",e=>{
    pressed[e.key.toLowerCase()]=true;

    if(e.key==="1") equip(0);
    if(e.key==="2") equip(1);
    if(e.key==="3") equip(2);
    if(e.key==="4") equip(3);
    if(e.key.toLowerCase()==="r") reload();
});

addEventListener("keyup",e=>{
    pressed[e.key.toLowerCase()]=false;
});


/* =========================
   MOUSE
========================= */

addEventListener("mousemove",e=>{
    player.angle += e.movementX*0.003;
});

addEventListener("click",()=>{
    shoot();
});


/* =========================
   WEAPONS
========================= */

const weapons=[
    {
        name:"AR",
        ammo:30,
        maxAmmo:30,
        damage:25,
        delay:120
    },
    {
        name:"Handgun",
        ammo:12,
        maxAmmo:12,
        damage:40,
        delay:300
    },
    {
        name:"Fists",
        ammo:Infinity,
        maxAmmo:Infinity,
        damage:30,
        delay:400
    },
    {
        name:"Grenade",
        ammo:3,
        maxAmmo:3,
        damage:100,
        delay:800
    }
];

let current=0;
let ready=true;


function equip(index){

    current=index;

    document.querySelector("#ar").classList.add("hidden");
    document.querySelector("#handgun").classList.add("hidden");
    document.querySelector("#fists").classList.add("hidden");
    document.querySelector("#grenade").classList.add("hidden");

    const ids=[
        "ar",
        "handgun",
        "fists",
        "grenade"
    ];

    document.querySelector("#"+ids[index])
        .classList.remove("hidden");

    updateHUD();

    message("Equipped "+weapons[index].name);
}


function shoot(){

    if(!ready)return;

    const weapon=weapons[current];

    if(weapon.ammo<=0){
        message("OUT OF AMMO — PRESS R");
        return;
    }

    ready=false;

    if(weapon.ammo!==Infinity){
        weapon.ammo--;
    }

    if(current===0 || current===1){
        gunShot();
    }

    if(current===2){
        punch();
    }

    if(current===3){
        grenadeThrow();
    }

    updateHUD();

    setTimeout(()=>{
        ready=true;
    },weapon.delay);
}


function reload(){

    const weapon=weapons[current];

    if(weapon.ammo===Infinity)return;

    weapon.ammo=weapon.maxAmmo;

    message("RELOADED");

    updateHUD();
}


/* =========================
   SHOOTING
========================= */

function gunShot(){

    hitEnemy(weapons[current].damage);

    const gun=document.querySelector(
        current===0 ? "#ar" : "#handgun"
    );

    gun.style.transform="translateX(12px) rotate(-5deg)";

    setTimeout(()=>{
        gun.style.transform="";
    },60);
}


function punch(){

    message("PUNCH!");

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        const dx=enemy.x-player.x;
        const dy=enemy.y-player.y;

        const distance=Math.hypot(dx,dy);

        if(distance<90){
            enemy.health-=30;

            if(enemy.health<=0){
                enemy.alive=false;
                message("+10 KEYS");
            }
        }
    }
}


function grenadeThrow(){

    message("BOOM!");

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        const dx=enemy.x-player.x;
        const dy=enemy.y-player.y;

        const distance=Math.hypot(dx,dy);

        if(distance<250){
            enemy.health-=100;

            if(enemy.health<=0){
                enemy.alive=false;
            }
        }
    }
}


/* =========================
   ENEMIES
========================= */

const enemies=[
    {x:250,y:50,health:100,alive:true},
    {x:-250,y:100,health:100,alive:true},
    {x:100,y:-250,health:100,alive:true},
    {x:-100,y:-300,health:100,alive:true}
];


function hitEnemy(damage){

    let target=null;
    let best=Infinity;

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        const dx=enemy.x-player.x;
        const dy=enemy.y-player.y;

        const distance=Math.hypot(dx,dy);

        if(distance>500)continue;

        const angle=Math.atan2(dy,dx);

        let difference=angle-player.angle;

        while(difference>Math.PI)
            difference-=Math.PI*2;

        while(difference<-Math.PI)
            difference+=Math.PI*2;

        if(Math.abs(difference)<0.12 && distance<best){

            best=distance;
            target=enemy;
        }
    }

    if(target){

        target.health-=damage;

        showHit();

        if(target.health<=0){
            target.alive=false;
            message("ELIMINATION!");
        }else{
            message("HIT -"+damage);
        }
    }
}


/* =========================
   PLAYER MOVEMENT
========================= */

function movement(){

    let x=0;
    let y=0;

    if(pressed.w){
        x+=Math.cos(player.angle);
        y+=Math.sin(player.angle);
    }

    if(pressed.s){
        x-=Math.cos(player.angle);
        y-=Math.sin(player.angle);
    }

    if(pressed.a){
        x+=Math.cos(player.angle-Math.PI/2);
        y+=Math.sin(player.angle-Math.PI/2);
    }

    if(pressed.d){
        x+=Math.cos(player.angle+Math.PI/2);
        y+=Math.sin(player.angle+Math.PI/2);
    }

    const length=Math.hypot(x,y);

    if(length){

        x/=length;
        y/=length;

        player.x+=x*player.speed;
        player.y+=y*player.speed;
    }
}


/* =========================
   WORLD
========================= */

function drawWorld(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // sky
    ctx.fillStyle="#202631";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height/2
    );

    // floor
    ctx.fillStyle="#34383d";

    ctx.fillRect(
        0,
        canvas.height/2,
        canvas.width,
        canvas.height/2
    );

    // horizon
    ctx.fillStyle="#111";

    ctx.fillRect(
        0,
        canvas.height/2-3,
        canvas.width,
        6
    );

    // floor lines
    ctx.strokeStyle="rgba(255,255,255,.08)";

    for(let i=1;i<18;i++){

        const y=
            canvas.height/2+
            Math.pow(i/18,1.7)*
            canvas.height/2;

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }

    drawEnemies();
}


/* =========================
   ENEMY RENDERING
========================= */

function drawEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        const dx=enemy.x-player.x;
        const dy=enemy.y-player.y;

        const distance=Math.hypot(dx,dy);

        if(distance<10)continue;

        let angle=Math.atan2(dy,dx)-player.angle;

        while(angle>Math.PI)
            angle-=Math.PI*2;

        while(angle<-Math.PI)
            angle+=Math.PI*2;

        if(Math.abs(angle)>0.8)continue;

        const screenX=
            canvas.width/2+
            angle*canvas.width;

        const size=Math.max(
            25,
            5000/distance
        );

        const bottom=
            canvas.height/2+
            10000/distance;

        // body
        ctx.fillStyle="#c93434";

        ctx.fillRect(
            screenX-size/3,
            bottom-size,
            size*.66,
            size
        );

        // head
        ctx.fillStyle="#d99570";

        ctx.beginPath();

        ctx.arc(
            screenX,
            bottom-size*1.15,
            size*.28,
            0,
            Math.PI*2
        );

        ctx.fill();

        // health bar
        ctx.fillStyle="#111";

        ctx.fillRect(
            screenX-size/2,
            bottom-size*1.55,
            size,
            7
        );

        ctx.fillStyle="#37db63";

        ctx.fillRect(
            screenX-size/2,
            bottom-size*1.55,
            size*(enemy.health/100),
            7
        );
    }
}


/* =========================
   HUD
========================= */

function updateHUD(){

    const weapon=weapons[current];

    document.querySelector("#weaponName")
        .textContent=weapon.name;

    document.querySelector("#ammo")
        .textContent=
        weapon.ammo===Infinity
        ? "∞"
        : weapon.ammo+" / "+weapon.maxAmmo;
}


function message(text){

    const box=document.querySelector("#message");

    box.textContent=text;

    clearTimeout(message.timer);

    message.timer=setTimeout(()=>{
        box.textContent="RivalStrike";
    },1000);
}


function showHit(){

    const hit=document.querySelector("#hitmarker");

    hit.classList.remove("hit");

    void hit.offsetWidth;

    hit.classList.add("hit");
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    movement();

    drawWorld();

    requestAnimationFrame(gameLoop);
}


equip(0);
gameLoop();

</script>

</body>
</html>
